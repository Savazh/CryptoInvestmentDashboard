<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crypto Investment Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Crypto Dashboard</a>
            <div>
                {% if current_user.is_authenticated %}
                    <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a class="btn btn-info" href="{{ url_for('portfolio') }}">Portfolio</a>
                    <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="btn btn-success" href="{{ url_for('login') }}">Login</a>
                    <a class="btn btn-info" href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
